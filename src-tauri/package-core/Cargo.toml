[package]
name = "dashledge-package-core"
version = "0.1.0"
description = "Dashledge widget package validation, shared by the app and the dashledge-package CLI"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "dashledge_package_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
semver = "1"
ring = "0.17"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
base64 = "0.22"
