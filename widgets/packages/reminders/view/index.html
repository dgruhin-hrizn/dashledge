<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reminders</title>
  <link rel="stylesheet" href="style.css">
  <script src="model.js" defer></script>
  <script src="widget.js" defer></script>
</head>
<body>
  <main class="rm" id="widget" aria-label="Reminders" data-state="loading">
    <!-- Hero: today's progress dial, what's left, and the next reminder due. -->
    <header class="rm-hero" id="hero">
      <div class="rm-dial" id="dial" role="img" aria-label="Today">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" class="rm-stop-a"/><stop offset="1" class="rm-stop-b"/>
            </linearGradient>
          </defs>
          <circle class="rm-dial-track" cx="60" cy="60" r="52"/>
          <circle class="rm-dial-ticks" cx="60" cy="60" r="44" pathLength="120"/>
          <circle class="rm-dial-arc" id="arc" cx="60" cy="60" r="52" pathLength="100"/>
        </svg>
        <div class="rm-dial-center">
          <span class="rm-count" id="count">–</span>
          <span class="rm-count-label" id="countLabel">left today</span>
        </div>
      </div>
      <div class="rm-hero-text">
        <div class="rm-chips" id="chips"></div>
        <div class="rm-next" id="next" hidden>
          <span class="rm-next-label">Next up</span>
          <span class="rm-next-title" id="nextTitle"></span>
          <span class="rm-next-when" id="nextWhen"></span>
        </div>
        <button type="button" class="rm-voice-line" id="voiceLine" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          <span id="voiceText">Spoken reminders are off</span>
        </button>
      </div>
      <div class="rm-actions">
        <button type="button" class="rm-new" id="add" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New reminder</span>
        </button>
        <button type="button" class="rm-icon" id="mute" aria-pressed="false" aria-label="Mute Dashledge’s voice" hidden>
          <svg class="rm-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          <svg class="rm-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></svg>
        </button>
        <button type="button" class="rm-icon" id="gear" aria-label="Reminders settings for this placement">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5"/></svg>
        </button>
      </div>
    </header>
    <section class="rm-body" id="body"></section>
    <p class="rm-toast" id="toast" role="status" hidden></p>

    <!-- New reminder: the title from the touch keyboard, then when, how important, where. -->
    <div class="rm-sheet" id="addSheet" role="dialog" aria-modal="true" aria-labelledby="addHeading" hidden>
      <div class="rm-sheet-card">
        <header class="rm-sheet-head">
          <h2 id="addHeading">New reminder</h2>
          <button type="button" class="rm-icon" id="addClose" aria-label="Cancel new reminder">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </header>
        <div class="rm-sheet-body rm-add-body">
          <div class="rm-add-main">
            <button type="button" class="rm-title-field" id="addTitle" aria-label="Edit the reminder’s title"></button>
            <div class="rm-when-now" id="addWhen" aria-live="polite">No date</div>
            <div class="rm-field" id="addListField">
              <span class="rm-field-label">List</span>
              <div class="rm-choices" id="addLists"></div>
            </div>
            <div class="rm-field">
              <span class="rm-field-label">Priority</span>
              <div class="rm-choices" id="addPriority"></div>
            </div>
          </div>
          <div class="rm-add-when">
            <span class="rm-field-label">When</span>
            <div class="rm-choices" id="addPicks"></div>
            <div class="rm-steppers" id="addSteppers">
              <div class="rm-stepper" id="dayStepper">
                <button type="button" class="rm-icon" data-step="-1" aria-label="Day before"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg></button>
                <span class="rm-stepper-value" id="dayValue"></span>
                <button type="button" class="rm-icon" data-step="1" aria-label="Day after"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg></button>
              </div>
              <div class="rm-stepper" id="timeStepper">
                <button type="button" class="rm-icon" data-step="-1" aria-label="15 minutes earlier"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
                <span class="rm-stepper-value" id="timeValue"></span>
                <button type="button" class="rm-icon" data-step="1" aria-label="15 minutes later"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
              </div>
              <button type="button" class="rm-button rm-toggle" id="allDay" aria-pressed="false">All day</button>
            </div>
          </div>
        </div>
        <footer class="rm-sheet-foot">
          <button type="button" class="rm-button" id="addCancel">Cancel</button>
          <button type="button" class="rm-button rm-primary" id="addSave">Add reminder</button>
        </footer>
      </div>
    </div>

    <!-- Spoken reminders: one setting for all of Dashledge, edited as a draft. -->
    <div class="rm-sheet" id="voiceSheet" role="dialog" aria-modal="true" aria-labelledby="voiceHeading" hidden>
      <div class="rm-sheet-card">
        <header class="rm-sheet-head">
          <h2 id="voiceHeading">Spoken reminders</h2>
          <span class="rm-scope">All of Dashledge, on every page</span>
          <button type="button" class="rm-icon" id="voiceClose" aria-label="Cancel voice changes">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </header>
        <div class="rm-sheet-body rm-voice-body">
          <div class="rm-voice-col">
            <button type="button" class="rm-switch" id="voiceEnabled" role="switch" aria-checked="false">
              <span class="rm-switch-text"><strong>Say reminders when they’re due</strong><small>Reminders with a due time, from every list</small></span>
              <span class="rm-switch-knob" aria-hidden="true"></span>
            </button>
            <div class="rm-field">
              <span class="rm-field-label">Also say it early</span>
              <div class="rm-choices" id="voiceLead"></div>
            </div>
          </div>
          <div class="rm-voice-col">
            <div class="rm-voice-shared">
              <span class="rm-field-label">Voice for all of Dashledge</span>
              <strong id="voiceName">Best available</strong>
              <span id="voiceQuietText"></span>
              <small>Choose the voice, volume and quiet hours in Dashledge Settings › General › Voice. Natural voices are a free download there.</small>
              <button type="button" class="rm-button" id="voiceOpenSettings">Open Dashledge Settings</button>
            </div>
          </div>
        </div>
        <footer class="rm-sheet-foot">
          <button type="button" class="rm-button" id="voiceTest">Hear it</button>
          <span class="rm-foot-gap"></span>
          <button type="button" class="rm-button" id="voiceCancel">Cancel</button>
          <button type="button" class="rm-button rm-primary" id="voiceSave">Save</button>
        </footer>
      </div>
    </div>
  </main>
</body>
</html>
