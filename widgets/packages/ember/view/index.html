  <header class="masthead">
    <div class="identity"><img src="ember-mark.png" alt=""><h1>Ember</h1><span class="heat" hidden role="img"></span></div>
    <nav aria-label="Ember views">
      <button type="button" data-view="overview" aria-pressed="true"><span class="nav-icon graph" aria-hidden="true"></span>Usage</button>
      <button type="button" data-view="tabs" aria-pressed="false"><span class="nav-icon discussion" aria-hidden="true"></span>Chats</button>
      <button type="button" data-view="todos" aria-pressed="false"><span class="nav-icon checklist" aria-hidden="true"></span>Plans</button>
    </nav>
    <div class="status"><span id="connection" class="connection" role="status">Connecting</span><small id="source"></small></div>
  </header>
  <main class="dashboard">
    <section id="board" aria-label="Ember dashboard">
      <div id="cards" data-layout="overview"></div>
    </section>
    <section id="plans-view" aria-label="Plans" hidden>
      <section class="panel plan-board"><header><h2 id="plan-title"></h2></header>
        <div id="plan-band"><strong id="plan-progress"></strong><span id="plan-count"></span><div id="step-strip" aria-hidden="true"></div></div>
        <ol id="plan-steps" aria-label="Plan steps"></ol>
      </section>
      <aside class="panel plan-index"><h2>Plans</h2><div id="plan-list"></div></aside>
    </section>
    <section id="chat-view" aria-label="Ember chats" hidden>
      <section class="panel transcript" aria-label="Read-only transcript">
        <header class="transcript-header"><h2 id="transcript-title">Transcript</h2><span id="transcript-status"></span></header>
        <div id="messages" class="messages" role="region" aria-label="Chat history" tabindex="0"></div>
        <div class="live-step" id="working-line" hidden>
        <span class="ember-thinking-v8" data-active="true" data-tone="warm" aria-hidden="true">
          <img class="ember-static" src="ember-flame.png" alt="">
          <img class="ember-bracket left" src="ember-left.png" alt="">
          <img class="ember-bracket right" src="ember-right.png" alt="">
          <span class="ember-bracket-pulse left"></span><span class="ember-bracket-pulse right"></span>
      <svg class="ember-fire" viewBox="0 0 1102 933" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <clipPath id="working-clip" clipPathUnits="userSpaceOnUse">
            <path d="M495 64 C515 106 522 174 496 262 C470 346 384 403 357 475 C320 567 355 653 421 720 C455 752 511 776 559 786 C633 746 715 666 746 578 C785 470 741 376 683 287 C630 204 549 107 495 64 Z" />
          </clipPath>
          <radialGradient id="working-glow" cx="50%" cy="74%" r="50%">
            <stop offset="0" stop-color="#fff4bd" stop-opacity=".7" />
            <stop offset=".5" stop-color="#ff9c48" stop-opacity=".54" />
            <stop offset="1" stop-color="#ff742f" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="working-stream" x1="0" y1="1" x2=".15" y2="0">
            <stop offset="0" stop-color="#ff9b38" stop-opacity="0" />
            <stop offset=".33" stop-color="#ffe3a0" stop-opacity=".72" />
            <stop offset=".72" stop-color="#fff7de" stop-opacity=".64" />
            <stop offset="1" stop-color="#ffb35f" stop-opacity="0" />
          </linearGradient>
        </defs>
        <g clipPath="url(#working-clip)">
          <ellipse class="fire-pulse" cx="550" cy="650" rx="172" ry="190" fill="url(#working-glow)" />
          <path class="fire-stream fire-stream-a" d="M557 768 C455 669 444 583 508 500 C572 414 621 335 554 196 C655 347 639 439 557 545 C500 625 526 696 557 768Z" fill="url(#working-stream)" />
          <path class="fire-stream fire-stream-b" d="M569 776 C613 700 631 639 604 555 C579 481 572 439 613 359 C605 435 669 499 672 570 C675 650 630 730 569 776 Z" fill="url(#working-glow)" />
          <ellipse class="fire-soft fire-soft-a" cx="550" cy="635" rx="80" ry="155" fill="url(#working-glow)" />
          <ellipse class="fire-soft fire-soft-b" cx="609" cy="550" rx="63" ry="135" fill="url(#working-glow)" />
        </g>
        <g class="fire-sparks">
          <circle class="fire-spark spark-a" cx="512" cy="137" r="5" fill="#ffe5a6" />
          <circle class="fire-spark spark-b" cx="541" cy="115" r="3.8" fill="#ffad6f" />
          <circle class="fire-spark spark-c" cx="489" cy="175" r="3" fill="#fff1bf" />
        </g>
      </svg>
        </span>
          <span class="background-spinner" aria-hidden="true"></span>
          <span class="working-label"><span class="working-words"></span><span class="shimmer shimmer--rest" aria-hidden="true"><span></span></span><span class="shimmer shimmer--lit" aria-hidden="true"><span></span></span></span>
        </div>
        <button type="button" id="latest" aria-label="Back to live" title="Back to live" hidden><span aria-hidden="true">↓</span></button>
      </section>
      <aside class="panel chat-picker">
        <section id="workspace-picker" aria-labelledby="workspace-heading">
          <div class="panel-heading"><h2 id="workspace-heading">Chat History</h2></div>
          <div id="workspace-list" role="region" aria-labelledby="workspace-heading" tabindex="0"></div>
        </section>

        <section id="activity-now" class="activity-now" aria-label="Task activity" hidden>
          <div id="task-list"></div>
        </section>
      </aside>
    </section>
  </main>
</body>
