<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emby</title><link rel="stylesheet" href="style.css"><script defer src="marked.umd.js"></script><script defer src="widget.js"></script></head>
<body><header><div class="brand"><i aria-hidden="true"></i>emby</div><h1>Now playing</h1><small id="summary"></small><small id="host"></small><small id="status" role="status">Connecting</small></header>
<div id="layout"><main><div id="wall-controls" hidden><button type="button" data-step="-1" aria-label="Previous poster"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15.5 5l-7 7 7 7"/></svg></button><button type="button" data-step="1" aria-label="Next poster"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8.5 5l7 7-7 7"/></svg></button></div><div id="wall" aria-label="Playing and paused sessions"></div><section id="expanded" hidden aria-label="Playback details"><button id="back">‹ All posters</button><div id="feature"></div><div id="tracks"></div></section></main><aside id="rail" aria-label="Server activity"><section><small>Estimated stream bitrate</small><strong id="rate">—</strong><svg id="trend" viewBox="0 0 180 22" preserveAspectRatio="none" aria-hidden="true"><path/></svg><small id="mix"></small></section><section id="work"></section><button id="weekly" hidden aria-label="Next ranked title"></button><button id="update" hidden aria-haspopup="dialog"></button></aside></div>
<dialog id="release" aria-labelledby="release-title"><div class="release-head"><div><small>Emby Server · Release notes</small><h2 id="release-title"></h2></div><button id="dismiss">Done</button></div><article id="notes" tabindex="0"></article></dialog>
<footer><div id="viewers"></div><div id="additions" hidden><span class="ticker-label">Recently added</span><div class="ticker-window" tabindex="0" aria-label="Recently added titles"><div class="ticker-track"></div></div></div><div id="library"></div></footer></body></html>
