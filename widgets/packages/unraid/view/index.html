<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unraid</title><link rel="stylesheet" href="style.css"><script defer src="catalog-icons.js"></script><script defer src="assignments.js"></script><script defer src="widget.js"></script></head><body>
<header><img class="brand-logo" src="unraid.svg" alt="Unraid"><strong id="host"></strong><span id="version">Unraid</span><span id="uptime"></span><span id="live" role="status">Connecting</span></header>
<main id="overview">
<section class="storage panel"><div class="heading"><h2>Storage array</h2><span id="state"></span></div><div class="capacity"><b id="free">—</b><small>TB free</small></div><div class="meter"><i id="fill"></i></div><div class="caption" id="capacity"></div>
<button class="rack" id="disk-open"><span class="heading"><b>Array slots</b><span>Inspect ›</span></span><span id="bays"></span><span class="shelf-foot"><small id="baycount"></small><span id="parity"></span></span></button></section>
<section class="panel telemetry"><div class="heading"><h2>Performance</h2><small id="period">Last 30 min</small></div><div class="charts"><button type="button" class="metric" aria-pressed="false" aria-label="Focus CPU chart"><span class="metric-name">CPU</span><div class="legend"><span id="cpu"></span></div><svg viewBox="0 0 300 60" preserveAspectRatio="none" role="img" aria-label="CPU trend"><path id="cpupath"/></svg><span class="time-axis" aria-hidden="true"><span>−5 min</span><span>Now</span></span></button><button type="button" class="metric" aria-pressed="false" aria-label="Focus Memory chart"><span class="metric-name">Memory</span><div class="legend"><span id="memory"></span></div><svg viewBox="0 0 300 60" preserveAspectRatio="none" role="img" aria-label="Memory trend"><path id="memorypath"/></svg><span class="time-axis" aria-hidden="true"><span>−5 min</span><span>Now</span></span></button><button type="button" class="metric" aria-pressed="true" aria-label="Focus Array I/O chart"><span class="metric-name">Array I/O</span><div class="legend"><span id="read"></span><span id="write"></span></div><svg viewBox="0 0 300 60" preserveAspectRatio="none" role="img" aria-label="Array I/O trend"><path id="readpath"/><path id="writepath"/></svg><span class="time-axis" aria-hidden="true"><span>−30 min</span><span>Now</span></span></button><button type="button" class="metric" aria-pressed="false" aria-label="Focus Pool I/O chart"><span class="metric-name">Pool I/O</span><div class="legend"><span id="poolRead"></span><span id="poolWrite"></span></div><svg viewBox="0 0 300 60" preserveAspectRatio="none" role="img" aria-label="Pool I/O trend"><path id="poolReadpath"/><path id="poolWritepath"/></svg><span class="time-axis" aria-hidden="true"><span>−30 min</span><span>Now</span></span></button><button type="button" class="metric" aria-pressed="false" aria-label="Focus Network chart"><span class="metric-name">Network</span><div class="legend"><span id="rx"></span><span id="tx"></span></div><svg viewBox="0 0 300 60" preserveAspectRatio="none" role="img" aria-label="Network trend"><path id="rxpath"/><path id="txpath"/></svg><span class="time-axis" aria-hidden="true"><span>−5 min</span><span>Now</span></span></button></div></section>
<section class="services panel"><button id="alerts-open"><span class="heading"><b>Disk health</b><span>›</span></span><strong id="health"></strong><small id="issue"></small></button><div class="docker-list"><button id="docker-open"><b>Docker</b><span id="running"></span><span aria-hidden="true">›</span></button><div class="app-columns"><span>Container</span><span>CPU</span><span>RAM</span></div><div id="apps" aria-label="Running containers"></div><small id="hot"></small></div></section></main>
<section id="inspector" hidden><div class="heading"><h2 id="title"></h2><button id="close">‹ Overview</button></div><div id="rows"></div></section><small id="notice"></small></body></html>
