<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <link rel="stylesheet" href="style.css">
  <script src="model.js" defer></script>
  <script src="widget.js" defer></script>
</head>
<body>
  <svg class="sprites" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="g-sun" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#fff6c2"/><stop offset=".45" stop-color="#ffd54a"/><stop offset="1" stop-color="#ff9d2e"/></radialGradient>
      <radialGradient id="g-sun-glow"><stop offset=".35" stop-color="#ffcf4d" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf4d" stop-opacity="0"/></radialGradient>
      <linearGradient id="g-cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d3e3"/></linearGradient>
      <linearGradient id="g-cloud-dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4dbe8"/><stop offset="1" stop-color="#8592a8"/></linearGradient>
      <linearGradient id="g-cloud-back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aab6c9"/><stop offset="1" stop-color="#6f7c92"/></linearGradient>
      <linearGradient id="g-moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbe8"/><stop offset="1" stop-color="#c9cfe6"/></linearGradient>
      <linearGradient id="g-rain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd8ff"/><stop offset="1" stop-color="#3f9cff"/></linearGradient>
      <linearGradient id="g-bolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a0"/><stop offset="1" stop-color="#ffb21f"/></linearGradient>
      <g id="cloud-shape"><circle cx="16" cy="28" r="8"/><circle cx="25.5" cy="21.5" r="10.5"/><circle cx="35" cy="29" r="7"/><rect x="16" y="28" width="19" height="8"/></g>
      <g id="cloud-small"><circle cx="21" cy="32" r="6.5"/><circle cx="29" cy="26.5" r="8.5"/><circle cx="37" cy="33" r="6"/><rect x="21" y="32" width="16" height="6.5"/></g>
      <g id="sun-body"><circle cx="24" cy="24" r="20" fill="url(#g-sun-glow)"/><g stroke="#ffc53d" stroke-width="2.6" stroke-linecap="round"><path d="M24 3.5v4M24 40.5v4M3.5 24h4M40.5 24h4M9.5 9.5l2.8 2.8M35.7 35.7l2.8 2.8M9.5 38.5l2.8-2.8M35.7 12.3l2.8-2.8"/></g><circle cx="24" cy="24" r="10" fill="url(#g-sun)"/></g>
      <path id="moon-shape" d="M27 6a15 15 0 1 0 15 21A12 12 0 0 1 27 6z"/>
    </defs>
    <symbol id="w-clear" viewBox="0 0 48 48"><use href="#sun-body"/></symbol>
    <symbol id="w-clear-night" viewBox="0 0 48 48"><use href="#moon-shape" fill="url(#g-moon)" transform="translate(-2 2)"/><circle cx="38" cy="10" r="1.2" fill="#fff"/><circle cx="42" cy="19" r=".8" fill="#fff"/></symbol>
    <symbol id="w-partly" viewBox="0 0 48 48"><use href="#sun-body" transform="translate(-4 -6) scale(.8)"/><use href="#cloud-small" fill="url(#g-cloud)"/></symbol>
    <symbol id="w-partly-night" viewBox="0 0 48 48"><use href="#moon-shape" fill="url(#g-moon)" transform="translate(-6 -2) scale(.72)"/><use href="#cloud-small" fill="url(#g-cloud-dark)"/></symbol>
    <symbol id="w-cloudy" viewBox="0 0 48 48"><use href="#cloud-shape" fill="url(#g-cloud-back)" transform="translate(8 -6) scale(.8)"/><use href="#cloud-shape" fill="url(#g-cloud)" transform="translate(0 4)"/></symbol>
    <symbol id="w-fog" viewBox="0 0 48 48"><use href="#cloud-shape" fill="url(#g-cloud)" transform="translate(0 -4)"/><path d="M8 38h28M13 44h28" stroke="#b9c3d3" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="w-drizzle" viewBox="0 0 48 48"><use href="#cloud-shape" fill="url(#g-cloud)" transform="translate(0 -6)"/><path d="M16 37v2M25 37v2M34 37v2M20.5 43v2M29.5 43v2" stroke="url(#g-rain)" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="w-rain" viewBox="0 0 48 48"><use href="#cloud-shape" fill="url(#g-cloud-dark)" transform="translate(0 -6)"/><path d="M17 35l-3 8M26 35l-3 8M35 35l-3 8" stroke="url(#g-rain)" stroke-width="3.2" stroke-linecap="round"/></symbol>
    <symbol id="w-snow" viewBox="0 0 48 48"><use href="#cloud-shape" fill="url(#g-cloud)" transform="translate(0 -6)"/><g fill="#ffffff"><circle cx="16" cy="38" r="2.4"/><circle cx="26" cy="41" r="2.4"/><circle cx="35" cy="37.5" r="2.4"/><circle cx="21" cy="45" r="2"/><circle cx="31" cy="45.5" r="2"/></g></symbol>
    <symbol id="w-storm" viewBox="0 0 48 48"><use href="#cloud-shape" fill="url(#g-cloud-dark)" transform="translate(0 -6)"/><path d="M26 29l-6 9h6l-3 8 9-11h-6l3-6z" fill="url(#g-bolt)"/></symbol>
    <symbol id="i-drop" viewBox="0 0 16 16"><path d="M8 1.5C8 1.5 3 7.2 3 10.2a5 5 0 0 0 10 0C13 7.2 8 1.5 8 1.5z" fill="currentColor"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.4 7-12a7 7 0 0 0-14 0c0 5.6 7 12 7 12z" fill="currentColor"/><circle cx="12" cy="10" r="2.6" fill="#0b1019"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8zM19.4 13.5l1.8 1.4-1.9 3.3-2.2-.8a7.4 7.4 0 0 1-2.3 1.3l-.3 2.3h-3.8l-.4-2.3a7.4 7.4 0 0 1-2.2-1.3l-2.2.8-1.9-3.3 1.8-1.4a7.6 7.6 0 0 1 0-2.6L2 9.1l1.9-3.3 2.2.8a7.4 7.4 0 0 1 2.2-1.3L8.7 3h3.8l.3 2.3a7.4 7.4 0 0 1 2.3 1.3l2.2-.8 1.9 3.3-1.8 1.4a7.6 7.6 0 0 1 0 2.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </svg>

  <main class="wx" id="weather" data-state="loading" data-mode="wide" aria-label="Weather">
    <!-- The sky for the current condition, with rain, snow, stars or lightning drawn on top. -->
    <div class="wx-sky" id="sky" aria-hidden="true"><div class="wx-sky-glow"></div><div class="wx-clouds"></div><canvas id="fx"></canvas></div>

    <section class="wx-hero" aria-live="polite">
      <header class="wx-place">
        <svg class="wx-pin" aria-hidden="true"><use href="#i-pin"/></svg>
        <h1 id="place-name"></h1>
        <span id="place-detail"></span>
        <button type="button" class="wx-gear" id="gear" aria-label="Weather settings for this placement"><svg aria-hidden="true"><use href="#i-gear"/></svg></button>
      </header>
      <div class="wx-reading">
        <svg class="wx-icon" id="now-icon" aria-hidden="true"><use href="#w-cloudy"/></svg>
        <p class="wx-temp" id="now-temp" role="img"><b id="temp-value">–</b><span id="temp-unit">°F</span></p>
      </div>
      <div class="wx-summary">
        <strong id="condition"></strong>
        <span class="wx-feels" id="feels"></span>
      </div>
      <div class="wx-today" id="today-range" aria-hidden="true">
        <span class="wx-lo" id="lo"></span>
        <span class="wx-bar"><i id="today-fill"></i><b id="today-dot"></b></span>
        <span class="wx-hi" id="hi"></span>
      </div>
      <p class="wx-status" id="status" role="status"></p>
    </section>

    <section class="wx-panel wx-hourly" id="hourly" aria-label="Next 24 hours">
      <h2 class="wx-label">Next 24 hours</h2>
      <div class="wx-chart" id="chart"></div>
    </section>

    <section class="wx-panel wx-week" id="week" aria-label="Next 7 days">
      <h2 class="wx-label">7-day forecast</h2>
      <ol class="wx-days" id="days"></ol>
    </section>

    <section class="wx-details" id="details" aria-label="Conditions"></section>

    <section class="wx-message" id="message">
      <strong id="message-title">Loading weather…</strong>
      <span id="message-detail"></span>
      <button type="button" class="wx-action" id="message-action" hidden></button>
    </section>
    <!-- Before a forecast shows, the gear sits here so the location can always be changed. -->
    <button type="button" class="wx-gear wx-gear-corner" id="gear-corner" aria-label="Weather settings for this placement"><svg aria-hidden="true"><use href="#i-gear"/></svg></button>
  </main>
</body>
</html>
