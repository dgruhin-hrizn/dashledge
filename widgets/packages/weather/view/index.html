<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <link rel="stylesheet" href="style.css">
  <script src="model.js" defer></script>
  <script src="widget.js" defer></script>
</head>
<body>
  <svg class="sprites" aria-hidden="true" focusable="false">
    <defs>
      <g id="cloud-shape"><circle cx="16" cy="28" r="8"/><circle cx="25.5" cy="21.5" r="10.5"/><circle cx="35" cy="29" r="7"/><rect x="16" y="28" width="19" height="8"/></g>
      <g id="cloud-small"><circle cx="21" cy="32" r="6.5"/><circle cx="29" cy="26.5" r="8.5"/><circle cx="37" cy="33" r="6"/><rect x="21" y="32" width="16" height="6.5"/></g>
      <g id="sun-small"><g stroke="#ffc94d" stroke-width="2.6" stroke-linecap="round"><path d="M17 4.5v3.5M17 26v3.5M4.5 17H8M26 17h3.5M8.2 8.2l2.4 2.4M23.4 23.4l2.4 2.4M8.2 25.8l2.4-2.4M23.4 10.6l2.4-2.4"/></g><circle cx="17" cy="17" r="6.5" fill="#ffc94d"/></g>
      <path id="moon-shape" d="M27 6a15 15 0 1 0 15 21A12 12 0 0 1 27 6z"/>
    </defs>
    <symbol id="w-clear" viewBox="0 0 48 48"><g stroke="#ffc94d" stroke-width="3" stroke-linecap="round"><path d="M24 4v5M24 39v5M4 24h5M39 24h5M9.9 9.9l3.5 3.5M34.6 34.6l3.5 3.5M9.9 38.1l3.5-3.5M34.6 13.4l3.5-3.5"/></g><circle cx="24" cy="24" r="9.5" fill="#ffc94d"/></symbol>
    <symbol id="w-clear-night" viewBox="0 0 48 48"><use href="#moon-shape" fill="#e3e7f3" transform="translate(-2 2)"/></symbol>
    <symbol id="w-partly" viewBox="0 0 48 48"><use href="#sun-small"/><use href="#cloud-small" fill="#d9dfe8"/></symbol>
    <symbol id="w-partly-night" viewBox="0 0 48 48"><use href="#moon-shape" fill="#e3e7f3" transform="translate(-6 -2) scale(.72)"/><use href="#cloud-small" fill="#c9d0dc"/></symbol>
    <symbol id="w-cloudy" viewBox="0 0 48 48"><use href="#cloud-shape" fill="#8e98a8" transform="translate(8 -6) scale(.8)"/><use href="#cloud-shape" fill="#d3d9e3" transform="translate(0 4)"/></symbol>
    <symbol id="w-fog" viewBox="0 0 48 48"><use href="#cloud-shape" fill="#c5ccd8" transform="translate(0 -4)"/><path d="M8 38h28M13 44h28" stroke="#aeb7c5" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="w-drizzle" viewBox="0 0 48 48"><use href="#cloud-shape" fill="#cfd6e1" transform="translate(0 -6)"/><path d="M16 37v2M25 37v2M34 37v2M20.5 43v2M29.5 43v2" stroke="#7cc4ff" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="w-rain" viewBox="0 0 48 48"><use href="#cloud-shape" fill="#c3cbd8" transform="translate(0 -6)"/><path d="M17 35l-3 8M26 35l-3 8M35 35l-3 8" stroke="#6cb6ff" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="w-snow" viewBox="0 0 48 48"><use href="#cloud-shape" fill="#dfe5ee" transform="translate(0 -6)"/><g fill="#ffffff"><circle cx="16" cy="38" r="2.4"/><circle cx="26" cy="41" r="2.4"/><circle cx="35" cy="37.5" r="2.4"/><circle cx="21" cy="45" r="2"/><circle cx="31" cy="45.5" r="2"/></g></symbol>
    <symbol id="w-storm" viewBox="0 0 48 48"><use href="#cloud-shape" fill="#9aa4b4" transform="translate(0 -6)"/><path d="M26 29l-6 9h6l-3 8 9-11h-6l3-6z" fill="#ffc94d"/></symbol>
    <symbol id="i-drop" viewBox="0 0 16 16"><path d="M8 1.5C8 1.5 3 7.2 3 10.2a5 5 0 0 0 10 0C13 7.2 8 1.5 8 1.5z" fill="currentColor"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8zM19.4 13.5l1.8 1.4-1.9 3.3-2.2-.8a7.4 7.4 0 0 1-2.3 1.3l-.3 2.3h-3.8l-.4-2.3a7.4 7.4 0 0 1-2.2-1.3l-2.2.8-1.9-3.3 1.8-1.4a7.6 7.6 0 0 1 0-2.6L2 9.1l1.9-3.3 2.2.8a7.4 7.4 0 0 1 2.2-1.3L8.7 3h3.8l.3 2.3a7.4 7.4 0 0 1 2.3 1.3l2.2-.8 1.9 3.3-1.8 1.4a7.6 7.6 0 0 1 0 2.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </svg>

  <main class="wx" id="weather" data-state="loading" aria-label="Weather">
    <section class="wx-now" aria-live="polite">
      <header class="wx-place">
        <h1 id="place-name"></h1>
        <span id="place-detail"></span>
      </header>
      <div class="wx-reading">
        <svg class="wx-icon" id="now-icon" aria-hidden="true"><use href="#w-cloudy"/></svg>
        <p class="wx-temp" id="now-temp" role="img"><b id="temp-value">–</b><span id="temp-unit">°F</span></p>
      </div>
      <div class="wx-summary">
        <strong id="condition"></strong>
        <span class="wx-facts"><span id="feels"></span><span id="range"></span></span>
      </div>
      <p class="wx-status" id="status" role="status"></p>
    </section>
    <section class="wx-hours" id="hours" aria-label="Next 12 hours"></section>
    <section class="wx-message" id="message">
      <strong id="message-title">Loading weather…</strong>
      <span id="message-detail"></span>
      <button type="button" class="wx-action" id="message-action" hidden></button>
    </section>
    <button type="button" class="wx-gear" id="gear" aria-label="Weather settings"><svg aria-hidden="true"><use href="#i-gear"/></svg></button>
  </main>
</body>
</html>
